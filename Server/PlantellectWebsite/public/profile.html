<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Profile</title>

    <!-- Theme + collapsed state + sidebar logic: load here, NO defer, so there is no flash -->
    <script src="javascript/sidebar.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/public/profile.css">
    <!-- Must be LAST -->
    <link rel="stylesheet" href="css/public/public-theme.css">
</head>
<body>
    <header>
        <!-- nav-container--dark: dark text, because there is no photo behind the header here -->
        <div class="nav-container nav-container--dark">
            <button class="nav-hamburger" aria-label="Open sidebar" aria-expanded="false" aria-controls="librarySidebar">&#9776;</button>
            <nav>
                <a href="home.html">HOME</a>
                <a href="library.html">PLANT LIBRARY</a>
                <a href="about.html">ABOUT</a>
            </nav>
            <div class="auth-links">
                <a href="auth.html#login">SIGN IN</a>
                <a href="auth.html#register">SIGN UP</a>
            </div>
        </div>
    </header>

    <!-- No cucumber background here: it is only used on home.html and about.html -->

    <div class="library-container">
        <main class="profile-main">
            <div class="profile-card" id="profileCard" style="display: none;">
                <div class="profile-avatar" id="profileAvatar"></div>
                <h2 id="profileUsername"></h2>
                <p class="profile-email" id="profileEmail"></p>
                <div class="profile-roles" id="profileRoles"></div>
            </div>
            <div class="guest-prompt" id="guestPrompt" style="display: none;">
                <p>Please <a href="auth.html#login">sign in</a> to view your profile.</p>
            </div>
        </main>
    </div>

    <div class="sidebar-scrim"></div>
    <!-- Filled in by sidebar.js according to the signed-in role -->
    <aside class="sidebar" id="librarySidebar" aria-label="Sidebar"></aside>

    <script src="javascript/logout.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/nav-toggle.js"></script>
    <script src="javascript/profile-script.js"></script>
</body>
</html>
