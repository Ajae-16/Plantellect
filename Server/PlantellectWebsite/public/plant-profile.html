<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Plant Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e2821;
            --secondary-dark: #2b3a2f;
            --accent-green: #4CAF50;
            --text-light: #ffffff;
            --text-muted: #b0c4b1;
            --danger-red: #e57373;
            --card-bg: rgba(30, 40, 33, 0.6);
        }

        body.light-mode {
            --primary-dark: #f0f4f1;
            --secondary-dark: #ffffff;
            --accent-green: #2e7d32;
            --text-light: #1a2e1b;
            --text-muted: #556b56;
            --danger-red: #c62828;
            --card-bg: rgba(230, 238, 232, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--secondary-dark);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid rgba(76, 175, 80, 0.2);
            transition: background-color 0.3s ease;
        }

        .profile-hero {
            position: relative;
            width: 100%;
            height: 320px;
            background: #111;
        }

        .profile-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .back-btn, .theme-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            text-decoration: none;
        }

        .theme-btn {
            padding: 8px;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            justify-content: center;
        }

        .back-btn:hover, .theme-btn:hover { background: rgba(0, 0, 0, 0.8); }

        body.light-mode .back-btn,
        body.light-mode .theme-btn {
            background: rgba(255, 255, 255, 0.8);
            color: #1a2e1b;
        }

        body.light-mode .back-btn:hover,
        body.light-mode .theme-btn:hover { background: #fff; }

        .confidence-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .profile-content { padding: 30px; }

        .plant-titles h1 {
            font-size: 28px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .plant-titles h3 {
            font-size: 16px;
            color: var(--accent-green);
            font-style: italic;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            border-left: 4px solid var(--accent-green);
            transition: background-color 0.3s ease;
        }

        .info-card.warning { border-left-color: var(--danger-red); }

        .info-card h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            margin-bottom: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-card p, .info-card ul {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .info-card ul { padding-left: 18px; }
        .info-card p + p { margin-top: 8px; }

        .full-width-card { grid-column: 1 / -1; }

        .botanist-meta {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .contributor-info { display: flex; align-items: center; gap: 6px; }

        .contributor-info a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
        }

        .contributor-info a:hover { text-decoration: underline; }

        .verified-badge {
            color: var(--accent-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-hero">
            <img src="" alt="" id="plantImage">

            <div class="header-controls">
                <button class="back-btn" onclick="history.back()">
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Back
                </button>

                <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">
                    <span class="material-symbols-outlined" id="themeIcon" style="font-size: 20px;">light_mode</span>
                </button>
            </div>

            <div class="confidence-badge" id="confidenceBadge"></div>
        </div>

        <div class="profile-content">
            <div class="plant-titles">
                <h1 id="commonName">Loading...</h1>
                <h3 id="scientificName"></h3>
            </div>

            <div class="info-grid">
                <div class="info-card full-width-card">
                    <h4><span class="material-symbols-outlined">description</span> What it looks like</h4>
                    <p id="plantDescription"></p>
                </div>

                <div class="info-card">
                    <h4><span class="material-symbols-outlined">psychiatry</span> Common Uses</h4>
                    <ul id="plantUses"></ul>
                </div>

                <div class="info-card">
                    <h4><span class="material-symbols-outlined">verified</span> Health Benefits</h4>
                    <ul id="plantBenefits"></ul>
                </div>

                <div class="info-card warning full-width-card">
                    <h4><span class="material-symbols-outlined" style="color: var(--danger-red);">warning</span> Things to Watch Out For</h4>
                    <div id="plantHarmful"></div>
                </div>
            </div>

            <div class="botanist-meta">
                <span id="datasetSource"></span>
                <div class="contributor-info">
                    <span>Reviewed by:</span>
                    <a href="#" id="reviewerLink"></a>
                    <span class="verified-badge">
                        <span class="material-symbols-outlined" style="font-size: 15px;">check_circle</span> Verified Botanist
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- The profile is rendered from the API, so no static data bundle -->
    <script src="javascript/plant-profile.js"></script>

    <script>
        // Icon shows what you will switch TO: sun in dark mode, moon in light mode
        function applyTheme(mode) {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeBtn = document.getElementById('themeToggleBtn');

            if (mode === 'light') {
                body.classList.add('light-mode');
                themeIcon.textContent = 'dark_mode';
                themeBtn.title = "Switch to Dark Mode";
            } else {
                body.classList.remove('light-mode');
                themeIcon.textContent = 'light_mode';
                themeBtn.title = "Switch to Light Mode";
            }

            localStorage.setItem('plantellect-theme', mode);
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            applyTheme(isLight ? 'dark' : 'light');
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('plantellect-theme') || 'dark');
        });
    </script>
</body>
</html>
