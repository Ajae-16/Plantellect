<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Plant Library</title>

    <!-- Theme + collapsed state + sidebar logic: load here, NO defer, so there is no flash -->
    <script src="javascript/sidebar.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/public/library.css">
    <!-- Must be LAST -->
    <link rel="stylesheet" href="css/public/public-theme.css">
</head>
<body>

    <header>
        <!-- nav-container--dark: dark text, because there is no photo behind the header here -->
        <div class="nav-container nav-container--dark">
            <button class="nav-hamburger" aria-label="Open sidebar" aria-expanded="false" aria-controls="librarySidebar">&#9776;</button>
            <nav>
                <a href="home.html">HOME</a>
                <a href="#" class="active" onclick="openLibrary(event)">PLANT LIBRARY</a>
                <a href="about.html">ABOUT</a>
            </nav>
            <div class="auth-links">
                <a href="auth.html#login">SIGN IN</a>
                <a href="auth.html#register">SIGN UP</a>
            </div>
        </div>
    </header>

    <div class="library-container">

        <!-- Centered search bar with recent searches (styles live in library.css) -->
        <div class="library-search-container">
            <div class="search-input-wrapper">
                <input type="text" id="plantSearchInput" placeholder="Search for a plant..." autocomplete="off"
                       onkeyup="filterPlants()" onkeydown="handleSearchKey(event)" onfocus="showRecentSearches()">
                <span class="material-symbols-outlined search-icon">search</span>
            </div>

            <div id="recentSearchesDropdown" class="recent-searches-dropdown" style="display: none;">
                <div class="recent-searches-header">
                    <span>Recent Searches</span>
                    <span class="clear-recent" onclick="clearRecentSearches(event)">Clear</span>
                </div>
                <div id="recentSearchesList" class="recent-searches-pills"></div>
            </div>
        </div>

        <div class="main-workspace">
        <!-- Cards are rendered by library-script.js from GET /api/plants -->
        <main class="plant-grid" id="plantGrid">
            <p class="library-loading">Loading plants…</p>
        </main>
    </div>

    <div class="library-pagination" id="libraryPagination" hidden>
        <span class="library-pagination-info" id="libraryPaginationInfo"></span>
        <div class="library-pagination-controls" id="libraryPaginationControls"></div>
    </div>

    <div class="sidebar-scrim"></div>
    <!-- Same sidebar as the other pages, at body level. Filled in by sidebar.js according to the signed-in role -->
    <aside class="sidebar" id="librarySidebar" aria-label="Sidebar"></aside>

    <script src="javascript/nav-toggle.js"></script>
    <script src="javascript/logout.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/library-script.js"></script>

</body>
</html>
