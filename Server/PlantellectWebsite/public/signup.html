<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Sign Up</title>
    <link rel="stylesheet" href="css/signup-style.css">
</head>
<body>

    <div class="hero-container">
        <header>
            <div class="logo-area">
                <img src="resource/logo.png" alt="Plantellect Logo">
            </div>
            <div class="nav-container">
                <nav>
                    <a href="home.html">HOME</a>
                    <a href="#" onclick="openLibrary(event)">PLANT LIBRARY</a>
                    <a href="about.html">ABOUT</a>
                </nav>
                <div class="auth-links">
                    <a href="login.html">LOG IN</a>
                    <a href="#" class="active">SIGN UP</a>
                </div>
            </div>
        </header>

        <div class="signup-modal">
            <h2>SIGN UP</h2>
            <p class="subtitle">SIGN UP TO CONTINUE</p>

            <form id="signupForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder=" " required>
                    <label for="email">EMAIL</label>
                </div>

                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required>
                    <label for="username">USERNAME</label>
                </div>

                <div class="input-group password-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">PASSWORD</label>
                        <span class="eye-icon" id="togglePassword" onclick="togglePasswordVisibility()">&#128065;</span>
                    </div>
                </div>

                <button type="submit" class="signup-btn">SIGN UP</button>
            </form>

            <div class="guest-prompt">
                <a href="#" id="guestLink">AS GUEST</a>
            </div>
        </div>
    </div>

    <div id="guestModal" class="guest-popup-overlay" style="display: none;">
        <div class="guest-popup-box">
            <p>You're logged in as a Guest. Some features will require you to log in.</p>
            <button id="guestContinueBtn" class="guest-continue-btn">Continue</button>
        </div>
    </div>

    <div class="success-popup-overlay" id="successModal">
        <div class="success-popup-box">
            <p>Account created successfully!</p>
            <button class="success-redirect-btn" onclick="redirectToHome()">OK</button>
        </div>
    </div>

    <div class="success-popup-overlay" id="errorModal">
        <div class="success-popup-box error-popup-box">
            <p id="signupErrorMessage">Sign up failed. Please try again.</p>
            <button class="success-redirect-btn error-btn" onclick="closeErrorModal()">Try Again</button>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.style.opacity = '1';
            } else {
                passwordInput.type = 'password';
                toggleIcon.style.opacity = '0.6';
            }
        }

        function redirectToHome() {
            window.location.href = 'home.html';
        }

        function closeErrorModal() {
            const errorModal = document.getElementById('errorModal');
            if (errorModal) {
                errorModal.style.display = 'none';
            }
        }

        document.getElementById('guestLink').addEventListener('click', function (event) {
            event.preventDefault();
            document.getElementById('guestModal').style.display = 'flex';
        });

        document.getElementById('guestContinueBtn').addEventListener('click', function () {
            sessionStorage.setItem('guestMode', 'true');
            window.location.href = 'home.html';
        });

        document.getElementById('signupForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('username', data.username);
                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    document.getElementById('signupErrorMessage').textContent =
                        data.error || 'Sign up failed. Please try again.';
                    document.getElementById('errorModal').style.display = 'flex';
                }
            } catch (err) {
                document.getElementById('signupErrorMessage').textContent =
                    'Unable to connect to the server. Please try again.';
                document.getElementById('errorModal').style.display = 'flex';
            }
        });
    </script>

</body>
</html>
