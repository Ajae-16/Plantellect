<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Plantellect - Admin Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/public/auth.css">
    <!-- Must be after auth.css: it narrows the two-panel card to a single sign-in panel. -->
    <link rel="stylesheet" href="css/public/admin-auth.css">
</head>
<body>
    <div class="background-image"></div>
    <div class="hero-container">
        <a href="download-app.html" class="auth-back-btn" aria-label="Back">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            <span class="auth-back-text">Back</span>
        </a>

        <!-- Same card as auth.html, sign-in only: no sign-up panel, no overlay, no forgot-password. -->
        <div class="auth-container admin-auth-container" id="authContainer">
            <div class="forms-wrapper">
                <div class="form-container login-container">
                    <h2>ADMIN SIGN IN</h2>
                    <img src="resource/logo.png" alt="Plantellect Logo" class="plantellect-logo">

                    <form id="adminLoginForm" class="auth-form" autocomplete="on">

                        <div class="container-input-group">
                            <div class="input-group">
                                <input type="text" id="loginIdentifier" placeholder=" " autocomplete="username" required>
                                <label for="loginIdentifier">USERNAME OR EMAIL</label>
                                <span class="material-symbols-outlined input-icon">person</span>
                            </div>

                            <div class="input-group password-group">
                                <div class="password-wrapper">
                                    <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
                                    <label for="loginPassword">PASSWORD</label>
                                    <span class="material-symbols-outlined input-icon">lock</span>
                                    <span class="eye-icon" id="toggleLoginPassword" role="button" tabindex="0" aria-label="Show password">&#128065;</span>
                                </div>
                            </div>
                        </div>

                        <p class="admin-auth-error" id="adminAuthError" role="alert" hidden></p>

                        <button type="submit" class="login-btn" id="adminLoginBtn">Sign in</button>
                    </form>
                    <div class="auth-container-footer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="javascript/admin-auth.js"></script>
</body>
</html>
