<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect</title>

    <!-- Theme + collapsed state + sidebar logic: load here, NO defer, so there is no flash -->
    <script src="javascript/sidebar.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/public/home.css">
    <!-- Must be LAST -->
    <link rel="stylesheet" href="css/public/public-theme.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button class="nav-hamburger" aria-label="Open sidebar" aria-expanded="false" aria-controls="librarySidebar">&#9776;</button>
            <nav>
                <a href="home.html" class="active">HOME</a>
                <a href="#" onclick="openLibrary(event)">PLANT LIBRARY</a>
                <a href="about.html">ABOUT</a>
            </nav>
            <div class="auth-links">
                <a href="auth.html#login">SIGN IN</a>
                <a href="auth.html#register">SIGN UP</a>
            </div>
        </div>
    </header>

    <!-- Cucumber photo: only home.html and about.html use the --cucumber modifier -->
    <div class="background-image background-image--cucumber"></div>

    <div class="hero-container">
        <div class="hero-content">
            <h1>Explore,    and    Expand<br>Your Botanist Mind</h1>
            <p>Identify, share, and discover plants with a
            <br>community that grows knowledge together.</p>
        </div>
    </div>

    <!-- The 10 newest plants. Cards (and the loading skeletons) are filled in by home.js -->
    <div class="slider-wrapper" aria-label="Newest plants" aria-busy="true">
        <span class="slider-label">
            <span class="material-symbols-outlined" aria-hidden="true">eco</span>
            Newest plants
        </span>

        <div class="slider-viewport">
            <div class="slider-track" id="latestPlantsTrack"></div>
        </div>

        <button type="button" class="slider-pause" aria-label="Pause auto-scroll" aria-pressed="false">
            <span class="material-symbols-outlined" aria-hidden="true">pause</span>
        </button>
    </div>

    <div class="sidebar-scrim"></div>
    <!-- Filled in by sidebar.js according to the signed-in role -->
    <aside class="sidebar" id="librarySidebar" aria-label="Sidebar"></aside>

    <script src="javascript/logout.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/nav-toggle.js"></script>
    <script src="javascript/home.js"></script>
</body>
</html>
