<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Discoveries</title>

    <!-- Theme + collapsed state + sidebar logic: load here, NO defer, so there is no flash -->
    <script src="javascript/sidebar.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/public/discoveries.css">
    <!-- Must be LAST -->
    <link rel="stylesheet" href="css/public/public-theme.css">
</head>
<body>

    <header>
        <!-- nav-container--dark: dark text, because there is no photo behind the header here -->
        <div class="nav-container nav-container--dark">
            <button class="nav-hamburger" aria-label="Open sidebar" aria-expanded="false" aria-controls="librarySidebar">&#9776;</button>
            <nav>
                <a href="home.html">HOME</a>
                <a href="library.html">PLANT LIBRARY</a>
                <a href="about.html">ABOUT</a>
            </nav>
            <div class="auth-links">
                <a href="auth.html#login">SIGN IN</a>
                <a href="auth.html#register">SIGN UP</a>
            </div>
        </div>
    </header>

    <div class="library-container discoveries-container">

        <div class="discoveries-header">
            <h1>Discoveries</h1>
            <p class="discoveries-muted">
                Plants people could not identify. Claim one, record it, and an admin closes it when
                the record is approved.
            </p>
            <p id="discoveryNotice" class="discoveries-notice" hidden></p>
        </div>

        <!-- Load-bearing, and not decoration: "1 of 5 botanists agree" must name the
             electorate, or a count nobody can reason about looks arbitrary. -->
        <p id="discoveryQuorum" class="discoveries-quorum" hidden></p>

        <div id="discoveryList" class="discovery-list">
            <p class="discoveries-muted">Loading the queue&hellip;</p>
        </div>

        <div id="discoveryPagination" class="discoveries-pagination" hidden>
            <button type="button" class="btn discoveries-btn-secondary" id="discoveryPrev">Previous</button>
            <span id="discoveryInfo" class="discoveries-muted"></span>
            <button type="button" class="btn discoveries-btn-secondary" id="discoveryNext">Next</button>
        </div>
    </div>

    <!-- Not gated on record_plant: a plain user has no queue, but a plain user
         can still be shown the message rather than a blank page. -->
    <aside class="sidebar" id="librarySidebar" aria-label="Sidebar"></aside>

    <script src="javascript/nav-toggle.js"></script>
    <script src="javascript/logout.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/discoveries-script.js"></script>

</body>
</html>
