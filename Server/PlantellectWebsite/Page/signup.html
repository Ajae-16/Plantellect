<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantellect - Sign Up</title>
    <!-- Link to your external signup stylesheet -->
    <link rel="stylesheet" href="../Css/signup-style.css">
</head>
<body>

    <div class="hero-container">
        <!-- Top Navigation Bar -->
        <header>
            <div class="logo-area">
                <img src="../Resource/logo.png" alt="Plantellect Logo">
            </div>
            <div class="nav-container">
                <nav>
                     <a href="../index.html">HOME</a>
                    <a href="library-error.html">PLANT LIBRARY</a>
                    <a href="about.html">ABOUT</a>
                </nav>
                <div class="auth-links">
                    <a href="login.html">LOG IN</a>
                    <a href="#" class="active">SIGN UP</a>
                </div>
            </div>
        </header>

        <!-- Sign Up Modal Container -->
        <div class="signup-modal">
            <h2>SIGN UP</h2>
            <p class="subtitle">SIGN UP TO CONTINUE</p>
            
            <form>
                <!-- Name Input Group -->
                <div class="input-group">
                    <input type="text" id="name" placeholder=" " required>
                    <label for="name">NAME</label>
                </div>

                <!-- Username Input Group -->
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required>
                    <label for="username">USERNAME</label>
                </div>

                <!-- Password Input Group -->
                <div class="input-group password-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">PASSWORD</label>
                        <span class="eye-icon" id="togglePassword" onclick="togglePasswordVisibility()">👁</span>
                    </div>
                </div>

                <button type="submit" class="signup-btn">SIGN UP</button>
            </form>

            <div class="guest-prompt">
                <a href="#" onclick="openGuestModal(event)">AS GUEST</a>
            </div>
        </div>
    </div>

    <!-- Guest Notice Popup Modal -->
    <div id="guestModal" class="guest-popup-overlay" style="display: none;">
        <div class="guest-popup-box">
            <p>You're logged in as a Guest. Some features will require you to log in.</p>
            <button id="guestContinueBtn" class="guest-continue-btn">Continue</button>
        </div>
    </div>

    <!-- JavaScript for password visibility and guest popup actions -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.style.opacity = '1';
            } else {
                passwordInput.type = 'password';
                toggleIcon.style.opacity = '0.6';
            }
        }

        function openGuestModal(event) {
            event.preventDefault();
            document.getElementById('guestModal').style.display = 'flex';
        }

        document.getElementById('guestContinueBtn').addEventListener('click', function() {
            sessionStorage.setItem('userRole', 'guest'); // Saves guest status before redirecting
            window.location.href = '../index.html';
        });
    </script>

</body>
</html>
