name: plantellect_database

version: '3.8'

services:
  # Structured Data (Users, Taxonomy, Roles)
  mysql_db:
    image: mysql:8.0
    container_name: mysql_plantellectdb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: plantellectdb
      MYSQL_USER: superadmin
      MYSQL_PASSWORD: plantpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Unstructured / AI Data (CNN outputs, logs, documents)
  mongo_db:
    image: mongo:latest
    container_name: mongo_plantellectdb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: superadmin
      MONGO_INITDB_ROOT_PASSWORD: plantpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

# ML Inference Service (FastAPI + TensorFlow CPU)
  ml_service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: plantellect_ml
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./ml/model:/app/model
    environment:
      - MODEL_PATH=/app/model/main/plantellect_model.keras
      - CLASSES_PATH=/app/model/main/classes.json
      - TF_CPP_MIN_LOG_LEVEL=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

volumes:
  mysql_data:
  mongo_data:
